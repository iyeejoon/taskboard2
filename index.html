<!DOCTYPE html>
<!-- 이 파일 하나에 화면(HTML) + 디자인(CSS) + 동작(JavaScript)이 모두 들어 있습니다. -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 휴대폰에서도 화면 크기에 맞게 보이도록 하는 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팀 업무요청 접수 보드</title>

  <style>
    /* ===================================================================
       [1] 색깔 이름표 (변수)
       자주 쓰는 색에 이름을 붙여둡니다. 나중에 색을 바꾸고 싶으면
       여기 값 하나만 고치면 화면 전체가 같이 바뀝니다.
       =================================================================== */
    :root {
      --배경색: #f4f5f7;        /* 페이지 전체 바탕 - 연한 회색 */
      --카드색: #ffffff;        /* 카드 바탕 - 흰색 */
      --테두리색: #e5e7eb;      /* 얇은 회색 선 */
      --글자색: #1f2937;        /* 진한 글씨 */
      --흐린글자색: #6b7280;    /* 보조 설명용 연한 글씨 */
      --포인트색: #2563eb;      /* 버튼 등에 쓰는 파란색 */
    }

    /* 모든 요소의 크기 계산 방식을 통일합니다. (여백 때문에 크기가 틀어지는 걸 막아줌) */
    * { box-sizing: border-box; }

    /* ===================================================================
       [2] 페이지 기본 모양
       =================================================================== */
    body {
      margin: 0;
      padding: 24px;
      background: var(--배경색);
      color: var(--글자색);
      /* 한글이 예쁘게 나오는 글꼴 순서대로 시도합니다 */
      font-family: "Pretendard", "맑은 고딕", "Malgun Gothic", -apple-system, sans-serif;
      line-height: 1.6;
    }

    /* 내용이 화면 가운데에 모이도록 최대 너비를 정합니다 */
    .전체틀 {
      max-width: 1180px;
      margin: 0 auto;
    }

    /* ------------------ 맨 위 제목줄 ------------------ */
    .머리말 {
      display: flex;              /* 제목과 건수를 가로로 나란히 */
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .머리말 h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.3px;
    }
    .머리말 .설명 {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--흐린글자색);
    }
    /* 오른쪽 "총 N건" 표시 */
    .총건수 {
      background: var(--카드색);
      border: 1px solid var(--테두리색);
      border-radius: 999px;       /* 숫자가 알약 모양이 되도록 */
      padding: 4px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--흐린글자색);
    }

    /* ------------------ 좌우 2단 배치 ------------------ */
    .본문 {
      display: grid;
      /* 왼쪽은 340px 고정, 오른쪽은 남는 공간 전부 */
      grid-template-columns: 340px 1fr;
      gap: 20px;
      align-items: start;
    }

    /* 화면 너비가 900px보다 좁아지면 위아래로 쌓습니다 (휴대폰 대응) */
    @media (max-width: 900px) {
      .본문 { grid-template-columns: 1fr; }
      body { padding: 16px; }
    }

    /* ------------------ 흰 카드 공통 모양 ------------------ */
    .카드 {
      background: var(--카드색);
      border: 1px solid var(--테두리색);
      border-radius: 12px;                        /* 모서리 둥글게 */
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);  /* 아주 옅은 그림자 */
    }

    /* ===================================================================
       [3] 왼쪽 - 등록 폼
       =================================================================== */
    .등록폼 {
      padding: 20px;
      position: sticky;   /* 목록을 아래로 내려도 폼은 화면에 붙어 따라옵니다 */
      top: 24px;
    }
    .등록폼 h2 {
      margin: 0 0 16px;
      font-size: 16px;
    }

    /* 입력칸 한 줄(설명 글씨 + 입력상자)을 묶는 상자 */
    .입력줄 { margin-bottom: 14px; }

    .입력줄 label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    /* 라벨 옆 빨간 별표 (필수 입력 표시) */
    .필수표시 { color: #dc2626; }

    /* 오류 안내 문구 - 평소에는 숨겨져 있다가 오류가 있을 때만 보입니다 */
    .오류문구 {
      display: none;
      margin: 6px 0 0;
      font-size: 12.5px;
      color: #dc2626;
    }

    /* 오류가 있는 입력줄: 테두리를 빨갛게, 안내 문구를 보이게 */
    .입력줄.입력오류 input,
    .입력줄.입력오류 textarea {
      border-color: #dc2626;
    }
    .입력줄.입력오류 .오류문구 {
      display: block;
    }

    /* 글자입력 / 날짜 / 선택목록 / 여러줄입력의 모양을 한 번에 지정 */
    .등록폼 input,
    .등록폼 select,
    .등록폼 textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--테두리색);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;   /* 위에서 정한 글꼴을 그대로 물려받음 */
      background: #fff;
      color: var(--글자색);
    }

    /* 입력칸을 클릭했을 때 파란 테두리로 표시 */
    .등록폼 input:focus,
    .등록폼 select:focus,
    .등록폼 textarea:focus {
      outline: none;
      border-color: var(--포인트색);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .등록폼 textarea {
      resize: vertical;   /* 세로로만 크기 조절 가능 */
      min-height: 90px;
    }

    /* 등록하기 버튼 */
    .등록버튼 {
      width: 100%;
      margin-top: 6px;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: var(--포인트색);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;    /* 마우스를 올리면 손가락 모양으로 */
    }
    .등록버튼:hover { background: #1d4ed8; }   /* 마우스를 올리면 조금 진하게 */

    /* ===================================================================
       [4] 오른쪽 - 요청 목록
       =================================================================== */
    .목록제목 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    /* ------------------ 유형 필터 버튼 ------------------ */
    .필터바 {
      display: flex;
      flex-wrap: wrap;   /* 좁은 화면에서는 버튼이 다음 줄로 넘어갑니다 */
      gap: 8px;
      margin-bottom: 14px;
    }
    .필터버튼 {
      padding: 6px 14px;
      border: 1px solid var(--테두리색);
      border-radius: 999px;
      background: #fff;
      color: var(--글자색);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .필터버튼:hover { background: #f3f4f6; }
    /* 지금 선택된 버튼: 파란 배경으로 눈에 띄게 */
    .필터버튼.활성 {
      background: var(--포인트색);
      border-color: var(--포인트색);
      color: #fff;
    }

    /* 카드들을 세로로 12px 간격을 두고 쌓습니다 */
    .목록 {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 요청 1건짜리 카드 */
    .요청카드 { padding: 16px 18px; }

    /* 카드 맨 윗줄: 배지들(왼쪽) + 삭제버튼(오른쪽) */
    .카드윗줄 {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .요청카드 .제목 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 700;
    }

    /* 요청자 · 접수일시 · 희망완료일이 들어가는 연한 글씨 줄 */
    .정보줄 {
      font-size: 12.5px;
      color: var(--흐린글자색);
      margin-bottom: 10px;
    }
    .정보줄 .구분 { margin: 0 7px; color: #d1d5db; }   /* 항목 사이의 옅은 세로선 */

    /* 상세 내용 */
    .상세내용 {
      margin: 0;
      font-size: 14px;
      color: #374151;
      white-space: pre-wrap;   /* 줄바꿈을 입력한 그대로 보여줌 */
      padding-top: 10px;
      border-top: 1px dashed var(--테두리색);   /* 위쪽에 점선 구분선 */
    }

    /* 삭제 버튼 (✕) - 오른쪽 끝으로 밀어냅니다 */
    .삭제버튼 {
      margin-left: auto;
      border: 1px solid var(--테두리색);
      background: #fff;
      color: #9ca3af;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }
    .삭제버튼:hover {
      background: #fef2f2;      /* 연한 빨강 바탕 */
      border-color: #fecaca;
      color: #dc2626;
    }

    /* 목록이 0건일 때 보여줄 안내 상자 */
    .비어있음 {
      padding: 48px 20px;
      text-align: center;
      color: var(--흐린글자색);
      font-size: 14px;
      border: 1px dashed var(--테두리색);
      border-radius: 12px;
      background: #fafafa;
    }

    /* ===================================================================
       [5] 배지 색깔
       - 유형 배지 : 연한 바탕 + 진한 글씨 (색이 꽉 찬 느낌)
       - 긴급도 배지 : 흰 바탕 + 테두리 선 (비어 있는 느낌)
       모양을 다르게 해서 색이 비슷해도 헷갈리지 않게 했습니다.
       =================================================================== */
    .배지 {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;   /* 배지 글씨가 중간에 줄바꿈되지 않도록 */
    }

    /* --- 요청 유형 5가지 --- */
    .유형-데이터요청 { background: #e0edff; color: #1d4ed8; }  /* 파랑 */
    .유형-시스템오류 { background: #ffe4e4; color: #b91c1c; }  /* 빨강 */
    .유형-자료작성   { background: #efe4ff; color: #6d28d9; }  /* 보라 */
    .유형-권한신청   { background: #dcfce7; color: #15803d; }  /* 초록 */
    .유형-기타       { background: #eceef1; color: #4b5563; }  /* 회색 */

    /* --- 긴급도 3가지 (테두리 스타일) --- */
    .긴급도 { background: #fff; border: 1.5px solid; }
    .긴급도-높음 { color: #dc2626; border-color: #fca5a5; }   /* 빨강 테두리 */
    .긴급도-보통 { color: #d97706; border-color: #fcd34d; }   /* 주황 테두리 */
    .긴급도-낮음 { color: #6b7280; border-color: #d1d5db; }   /* 회색 테두리 */
  </style>
</head>

<body>
<div class="전체틀">

  <!-- ============ 맨 위 제목줄 ============ -->
  <header class="머리말">
    <div>
      <h1>팀 업무요청 접수 보드</h1>
      <p class="설명">요청을 등록하면 오른쪽 목록 맨 위에 바로 추가됩니다.</p>
    </div>
    <!-- 총 건수 숫자는 JavaScript가 자동으로 채워 넣습니다 -->
    <span class="총건수">총 <span id="건수숫자">0</span>건</span>
  </header>

  <div class="본문">

    <!-- ============ 왼쪽 : 요청 등록 폼 ============ -->
    <!-- form 태그로 감싸두면 '필수 입력칸 비었는지' 확인을 브라우저가 알아서 해줍니다 -->
    <form class="카드 등록폼" id="등록폼">
      <h2>요청 등록</h2>

      <div class="입력줄">
        <label for="요청자">요청자 이름 <span class="필수표시">*</span></label>
        <input type="text" id="요청자" placeholder="예) 김서연">
        <p class="오류문구" id="요청자오류"></p>
      </div>

      <div class="입력줄">
        <label for="유형">요청 유형</label>
        <select id="유형">
          <option>데이터 요청</option>
          <option>시스템 오류</option>
          <option>자료 작성</option>
          <option>권한 신청</option>
          <option>기타</option>
        </select>
      </div>

      <div class="입력줄">
        <label for="제목">제목 <span class="필수표시">*</span></label>
        <input type="text" id="제목" placeholder="예) 3분기 매출 데이터 요청">
        <p class="오류문구" id="제목오류"></p>
      </div>

      <div class="입력줄">
        <label for="희망완료일">희망 완료일</label>
        <!-- type="date" 로 두면 달력에서 고를 수 있습니다 -->
        <input type="date" id="희망완료일" required>
      </div>

      <div class="입력줄">
        <label for="긴급도">긴급도</label>
        <select id="긴급도">
          <option>낮음</option>
          <!-- selected : 처음에 '보통'이 선택된 상태로 시작합니다 -->
          <option selected>보통</option>
          <option>높음</option>
        </select>
      </div>

      <div class="입력줄">
        <label for="상세내용">상세 내용 <span class="필수표시">*</span></label>
        <textarea id="상세내용" placeholder="어떤 도움이 필요한지 적어주세요."></textarea>
        <p class="오류문구" id="상세내용오류"></p>
      </div>

      <button type="submit" class="등록버튼">등록하기</button>
    </form>

    <!-- ============ 오른쪽 : 요청 목록 ============ -->
    <section>
      <h2 class="목록제목">요청 목록</h2>
      <!-- 유형 필터 버튼: JavaScript가 건수와 함께 채워 넣습니다. -->
      <div class="필터바" id="필터바"></div>
      <!-- 이 안쪽은 비워둡니다. JavaScript가 카드를 만들어 채워 넣습니다. -->
      <div class="목록" id="목록"></div>
    </section>

  </div>
</div>


<script>
/* =====================================================================
   여기서부터가 '동작'을 담당하는 부분입니다.

   기억할 규칙은 딱 하나!
   >>> 내용이 바뀌면(등록/삭제) 화면을 처음부터 다시 그린다 <<<
   ===================================================================== */


/* ---------------------------------------------------------------------
   [1] 요청 목록을 담아두는 상자 (배열)
   대괄호 [ ] 안에 요청 1건씩을 중괄호 { } 로 적어 넣었습니다.
   sample-requests.md 의 5건을 내용 그대로 옮겨둔 것입니다.
   화면에는 '최신순'으로 보여주므로, 여기 적힌 순서를 뒤집어서(맨 아래가 위로)
   그리게 됩니다.
   --------------------------------------------------------------------- */
let 요청목록 = [
  {
    번호: 1,
    요청자: "김서연",
    유형: "데이터 요청",
    접수일시: "2026-08-20 09:14",
    제목: "3분기 부서별 매출 원본 데이터",
    희망완료일: "2026-08-26",
    긴급도: "보통",
    상세내용: "3분기 실적 보고서에 넣을 부서별 매출 원본 데이터가 필요합니다. 가능하면 월별로 나뉜 형태로 부탁드립니다."
  },
  {
    번호: 2,
    요청자: "박준호",
    유형: "시스템 오류",
    접수일시: "2026-08-20 11:02",
    제목: "근태 시스템 로그인이 안 됩니다",
    희망완료일: "2026-08-22",
    긴급도: "높음",
    상세내용: "오늘 아침부터 근태 시스템 로그인 시 비밀번호 오류가 계속 뜹니다. 비밀번호 재설정도 메일이 오지 않습니다."
  },
  {
    번호: 3,
    요청자: "이지훈",
    유형: "자료 작성",
    접수일시: "2026-08-20 14:37",
    제목: "임원 보고용 채용 현황 요약",
    희망완료일: "2026-08-25",
    긴급도: "높음",
    상세내용: "다음 주 임원 보고에 들어갈 상반기 채용 현황 요약본이 필요합니다. 직무별 채용 인원과 이탈률 중심으로 부탁드립니다."
  },
  {
    번호: 4,
    요청자: "최민아",
    유형: "권한 신청",
    접수일시: "2026-08-21 09:05",
    제목: "재무 공유 드라이브 열람 권한",
    희망완료일: "2026-08-28",
    긴급도: "낮음",
    상세내용: "재무팀 공유 드라이브의 예산 폴더 열람 권한을 신청합니다. 하반기 예산 검토 업무 때문에 필요합니다."
  },
  {
    번호: 5,
    요청자: "정우성",
    유형: "기타",
    접수일시: "2026-08-21 10:20",
    제목: "팀 워크숍 장소 추천 부탁드립니다",
    희망완료일: "2026-09-04",
    긴급도: "낮음",
    상세내용: "10월 팀 워크숍 장소를 알아보고 있습니다. 20명 규모로 서울 근교 후보를 몇 곳 추천해 주시면 감사하겠습니다."
  }
];

/* 새 요청에 붙일 번호. 지금 5건이 있으니 다음은 6번부터 시작합니다. */
let 다음번호 = 6;

/* 필터 버튼에 쓸 유형 목록과, 지금 선택되어 있는 유형("전체"가 처음값) */
const 유형목록 = ["데이터 요청", "시스템 오류", "자료 작성", "권한 신청", "기타"];
let 현재필터 = "전체";


/* ---------------------------------------------------------------------
   [2] 도우미 함수들
   --------------------------------------------------------------------- */

/* 유형 이름("데이터 요청")을 CSS 반이름("유형-데이터요청")으로 바꿔줍니다.
   CSS 반이름에는 띄어쓰기를 쓸 수 없어서 공백을 지웁니다. */
function 유형반이름(유형) {
  return "유형-" + 유형.replace(" ", "");
}

/* 사용자가 입력한 글자를 화면에 안전하게 넣기 위한 처리입니다.
   < 같은 특수문자를 그대로 두면 화면이 깨질 수 있어 문자 그대로 보이게 바꿉니다. */
function 안전하게(글자) {
  return String(글자)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* 지금 시각을 "2026-08-21 10:20" 형태의 글자로 만들어 줍니다.
   padStart(2,"0") 은 한 자리 숫자 앞에 0을 붙이는 기능입니다. (9 → 09) */
function 지금시각() {
  const 지금 = new Date();
  const 연 = 지금.getFullYear();
  const 월 = String(지금.getMonth() + 1).padStart(2, "0");  // 월은 0부터 시작해서 +1
  const 일 = String(지금.getDate()).padStart(2, "0");
  const 시 = String(지금.getHours()).padStart(2, "0");
  const 분 = String(지금.getMinutes()).padStart(2, "0");
  return `${연}-${월}-${일} ${시}:${분}`;
}


/* 유형별로 몇 건씩 있는지 세어서 { "데이터 요청": 1, "시스템 오류": 1, ... } 형태로 돌려줍니다. */
function 유형별건수() {
  const 건수 = {};
  유형목록.forEach(function (유형) { 건수[유형] = 0; });
  요청목록.forEach(function (요청) { 건수[요청.유형] = (건수[요청.유형] || 0) + 1; });
  return 건수;
}

/* 필터 버튼(전체 + 유형 5가지)을 건수와 함께 그립니다. */
function 필터바그리기() {
  const 필터바칸 = document.getElementById("필터바");
  const 건수 = 유형별건수();

  const 버튼목록 = [{ 이름: "전체", 건수: 요청목록.length }].concat(
    유형목록.map(function (유형) { return { 이름: 유형, 건수: 건수[유형] }; })
  );

  필터바칸.innerHTML = 버튼목록.map(function (버튼) {
    const 활성여부 = 버튼.이름 === 현재필터 ? " 활성" : "";
    return `<button type="button" class="필터버튼${활성여부}" onclick="필터선택('${버튼.이름}')">${안전하게(버튼.이름)} ${버튼.건수}</button>`;
  }).join("");
}

/* 필터 버튼을 눌렀을 때 실행됩니다. */
function 필터선택(유형) {
  현재필터 = 유형;
  화면그리기();
}


/* ---------------------------------------------------------------------
   [3] 화면 그리기 (이 앱에서 가장 중요한 함수)
   요청목록 상자를 처음부터 끝까지 훑으면서 카드를 만들어 오른쪽에 뿌립니다.
   --------------------------------------------------------------------- */
function 화면그리기() {
  const 목록칸 = document.getElementById("목록");

  // (1) 맨 위의 "총 N건" 숫자를 지금 개수로 갱신합니다.
  document.getElementById("건수숫자").textContent = 요청목록.length;

  // (2) 필터 버튼들을 지금 개수에 맞춰 다시 그립니다.
  필터바그리기();

  // (3) 요청이 하나도 없으면 안내 문구만 보여주고 끝냅니다.
  if (요청목록.length === 0) {
    목록칸.innerHTML = '<div class="비어있음">아직 접수된 요청이 없습니다.<br>왼쪽 폼에서 첫 요청을 등록해 보세요.</div>';
    return;   // return : 여기서 함수를 끝냅니다
  }

  // (4) 지금 선택된 유형만 걸러냅니다. "전체"면 그대로 다 보여줍니다.
  const 필터된목록 = 현재필터 === "전체"
    ? 요청목록
    : 요청목록.filter(function (요청) { return 요청.유형 === 현재필터; });

  // (5) 해당 유형의 요청이 하나도 없으면 안내 문구만 보여주고 끝냅니다.
  if (필터된목록.length === 0) {
    목록칸.innerHTML = '<div class="비어있음">해당 유형의 요청이 없습니다</div>';
    return;
  }

  // (6) 최신순으로 보여주기 위해 순서를 뒤집습니다.
  //     slice() 로 복사본을 만든 뒤 뒤집어야 원본 상자가 망가지지 않습니다.
  const 보여줄목록 = 필터된목록.slice().reverse();

  // (4) 요청 1건씩 카드 HTML을 만들어 하나의 긴 글자로 이어 붙입니다.
  목록칸.innerHTML = 보여줄목록.map(function (요청) {
    return `
      <article class="카드 요청카드">
        <div class="카드윗줄">
          <span class="배지 ${유형반이름(요청.유형)}">${안전하게(요청.유형)}</span>
          <span class="배지 긴급도 긴급도-${안전하게(요청.긴급도)}">${안전하게(요청.긴급도)}</span>
          <!-- 삭제 버튼: 누르면 이 요청의 번호를 가지고 삭제하기() 를 부릅니다 -->
          <button class="삭제버튼" onclick="삭제하기(${요청.번호})" title="이 요청 삭제">✕</button>
        </div>

        <h3 class="제목">${안전하게(요청.제목)}</h3>

        <div class="정보줄">
          ${안전하게(요청.요청자)}
          <span class="구분">|</span> 접수 ${안전하게(요청.접수일시)}
          <span class="구분">|</span> 희망 완료일 ${안전하게(요청.희망완료일)}
        </div>

        <p class="상세내용">${안전하게(요청.상세내용)}</p>
      </article>
    `;
  }).join("");   // join("") : 카드 조각들을 빈틈없이 이어 붙입니다
}


/* ---------------------------------------------------------------------
   [4] 입력 검증 도우미 함수들
   --------------------------------------------------------------------- */

/* 검증해야 할 입력칸 3개를 미리 꺼내둡니다. */
const 요청자입력 = document.getElementById("요청자");
const 제목입력 = document.getElementById("제목");
const 상세내용입력 = document.getElementById("상세내용");

/* 입력칸에 오류 표시를 켭니다: 테두리를 빨갛게, 안내 문구를 보이게 합니다. */
function 오류표시(입력요소, 메시지) {
  const 입력줄 = 입력요소.closest(".입력줄");
  입력줄.classList.add("입력오류");
  const 오류칸 = 입력줄.querySelector(".오류문구");
  if (오류칸) 오류칸.textContent = 메시지;
}

/* 입력칸의 오류 표시를 끕니다. */
function 오류지우기(입력요소) {
  const 입력줄 = 입력요소.closest(".입력줄");
  입력줄.classList.remove("입력오류");
  const 오류칸 = 입력줄.querySelector(".오류문구");
  if (오류칸) 오류칸.textContent = "";
}

/* 다시 입력을 시작하면 그 칸의 빨간 표시를 바로 지웁니다. */
[요청자입력, 제목입력, 상세내용입력].forEach(function (요소) {
  요소.addEventListener("input", function () { 오류지우기(요소); });
});


/* ---------------------------------------------------------------------
   [5] 등록하기 - '등록하기' 버튼을 눌렀을 때 실행됩니다
   --------------------------------------------------------------------- */
document.getElementById("등록폼").addEventListener("submit", function (이벤트) {
  // 폼은 원래 누르면 페이지를 새로고침합니다. 그걸 막습니다.
  이벤트.preventDefault();

  // (1) 입력칸에 적힌 값을 꺼내면서 앞뒤 공백을 잘라냅니다.
  const 요청자값 = 요청자입력.value.trim();
  const 제목값 = 제목입력.value.trim();
  const 상세내용값 = 상세내용입력.value.trim();

  // (2) 검사하기 전에 이전 오류 표시를 모두 지웁니다.
  [요청자입력, 제목입력, 상세내용입력].forEach(오류지우기);

  // (3) 필수 항목이 비어 있는지, 상세 내용이 10자 이상인지 확인합니다.
  //     문제가 있는 첫 번째 칸을 기억해두었다가 나중에 그 칸으로 커서를 옮깁니다.
  let 첫오류칸 = null;

  if (!요청자값) {
    오류표시(요청자입력, "요청자를 입력해 주세요.");
    첫오류칸 = 첫오류칸 || 요청자입력;
  }

  if (!제목값) {
    오류표시(제목입력, "제목을 입력해 주세요.");
    첫오류칸 = 첫오류칸 || 제목입력;
  }

  if (!상세내용값) {
    오류표시(상세내용입력, "상세 내용을 입력해 주세요.");
    첫오류칸 = 첫오류칸 || 상세내용입력;
  } else if (상세내용값.length < 10) {
    오류표시(상세내용입력, "상세 내용을 10자 이상 입력해 주세요.");
    첫오류칸 = 첫오류칸 || 상세내용입력;
  }

  // (4) 문제가 있으면 등록하지 않고, 그 칸으로 커서를 옮긴 뒤 끝냅니다.
  if (첫오류칸) {
    첫오류칸.focus();
    return;
  }

  // (5) 새 요청 하나를 만듭니다.
  const 새요청 = {
    번호: 다음번호,
    요청자: 요청자값,
    유형: document.getElementById("유형").value,
    접수일시: 지금시각(),                                     // 접수 일시는 자동으로!
    제목: 제목값,
    희망완료일: document.getElementById("희망완료일").value,
    긴급도: document.getElementById("긴급도").value,
    상세내용: 상세내용값
  };

  // (6) 상자에 새 요청을 넣고, 다음에 쓸 번호를 1 올립니다.
  요청목록.push(새요청);
  다음번호 = 다음번호 + 1;

  // (7) 폼을 비워서 바로 다음 요청을 쓸 수 있게 합니다.
  this.reset();

  // (8) 내용이 바뀌었으니 화면을 다시 그립니다.
  화면그리기();
});


/* ---------------------------------------------------------------------
   [5] 삭제하기 - 카드의 ✕ 버튼을 눌렀을 때 실행됩니다
   --------------------------------------------------------------------- */
function 삭제하기(번호) {
  // (1) 실수로 지우는 걸 막기 위해 한 번 물어봅니다.
  if (!confirm("이 요청을 삭제할까요?")) {
    return;   // '취소'를 누르면 아무것도 하지 않고 끝
  }

  // (2) filter : 조건에 맞는 것만 남깁니다.
  //     "번호가 다른 것들만 남긴다" = "이 번호짜리를 뺀다" 와 같은 뜻입니다.
  요청목록 = 요청목록.filter(function (요청) {
    return 요청.번호 !== 번호;
  });

  // (3) 내용이 바뀌었으니 화면을 다시 그립니다.
  화면그리기();
}


/* ---------------------------------------------------------------------
   [6] 페이지가 열리면 제일 먼저 화면을 한 번 그립니다.
   --------------------------------------------------------------------- */
화면그리기();
</script>

</body>
</html>
